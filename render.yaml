services:
  - type: web
    name: educa-finance-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: educa-finance-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
  - type: web
    name: educa-finance-web
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://educa-finance-api.onrender.com
  - type: postgresql
    name: educa-finance-db
    ipAllowList: []
